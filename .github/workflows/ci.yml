name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-ci.txt gives the reason for each pin. rashid keeps the
      # template's floor and stac-check stays unpinned. See docs/conformance.md.
      - name: Install the build and the validators
        run: python -m pip install -r requirements-ci.txt

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py

      # Data never enters git, so CI rebuilds the COGs from the sources that
      # tools/sources.json pins. --check fails when the STAC JSON disagrees
      # with what the build measures.
      - name: Build the data and check the STAC JSON
        run: python3 tools/build.py --check

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check,
      # because the COGs sit in staging/ and not beside the collection JSON.
      # The claims gates read the COGs in staging/.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
