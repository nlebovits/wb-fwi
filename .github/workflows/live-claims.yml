# Test every agent guide claim against the published objects each week.
#
# The PR gate reads COGs that CI builds. This job reads what readers read:
# the objects at data.source.coop. It also compares each published COG with
# the file:size and file:checksum in the STAC JSON. rashid then probes range
# requests and CORS on the published objects.
name: Live claims

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-claims
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build and the validators
        run: python -m pip install -r requirements-ci.txt

      - name: Claims against the published objects
        env:
          CLAIMS_LIVE: "1"
        run: python3 tests/test_agent_claims.py

      # The claims step above compares the published bytes, so rashid skips
      # its own byte pass and probes the hosting server.
      - name: rashid probes the published hosting
        run: >-
          rashid check catalog/ --no-data --live
          --live-base-url https://data.source.coop/portolan-mirrors/wb-fwi/
